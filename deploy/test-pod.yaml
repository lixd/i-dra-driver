apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: single-gopher
  namespace: default
spec:
  spec:
    devices:
      requests:
      - name: gopher
        exactly:
          deviceClassName: gopher.example.com
          allocationMode: ExactCount
          count: 1
---
apiVersion: v1
kind: Pod
metadata:
  name: gopher-test-pod
  namespace: default
spec:
  containers:
  - name: test
    image: docker.io/library/busybox:1.36
    imagePullPolicy: IfNotPresent
    command: ["sh", "-c"]
    args:
    - |
      echo "GOPHER env: $GOPHER"
      if [ -n "$GOPHER" ]; then
        echo "Gopher device allocated successfully!"
        for f in $(echo $GOPHER | tr ',' '\n'); do
          echo "Device file: /etc/gophers/$f"
          cat /etc/gophers/$f || echo "(file read failed)"
        done
      else
        echo "ERROR: No gopher device found"
      fi
      sleep 3600
    resources:
      claims:
      - name: gopher-claim
    volumeMounts:
    - name: gophers
      mountPath: /etc/gophers
      readOnly: true
  resourceClaims:
  - name: gopher-claim
    resourceClaimTemplateName: single-gopher
  volumes:
  - name: gophers
    hostPath:
      path: /etc/gophers
